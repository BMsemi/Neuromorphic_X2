  description: Commercial 512x512 1T1R analog in-memory compute macro with a 32-bit AHB subordinate interface
  repo: https://github.com/BMsemi/Neuromorphic_X2
  owner: BM LABS
  license: Apache-2.0
  author: BM LABS
  email: samarthjain@bmsemi.org
  version: v2.0.0
  date: 30-10-2026
  category: analog
  tags:
    - neuromorphic
    - AiMC
